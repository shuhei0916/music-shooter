      <stop offset="0" stop-color="#4da6ff"/>
      <stop offset="1" stop-color="#ff4d73"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#1b1e2e"/>
  <!-- 八分音符：たま・ぼう・はた -->
